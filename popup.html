<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 280px;
        font: 13px/1.4 system-ui, sans-serif;
        color: #1c1917;
        background: #fafaf9;
      }
      main { padding: 14px; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      p { margin: 0 0 12px; color: #57534e; }
      button {
        width: 100%;
        border: 0;
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
        cursor: pointer;
        margin-top: 6px;
      }
      #copy { background: #1c1917; color: white; }
      #clear { background: transparent; color: #57534e; }
      #status { min-height: 1.2em; margin-top: 8px; color: #0f766e; }
    </style>
  </head>
  <body>
    <main>
      <h1>Jamarkup</h1>
      <p>On the page, click Comment, click a section, write the change. Then copy the pile into your AI.</p>
      <button id="copy">Copy all comments</button>
      <button id="clear">Clear comments</button>
      <div id="status"></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
